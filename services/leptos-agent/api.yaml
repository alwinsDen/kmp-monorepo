openapi: 3.0.3
info:
  title: leptos-agent API
  version: 0.1.1
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health API
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /premium/submit:
    post:
      operationId: premiumApi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationSubmitRequest"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "200":
          description: "Event stream"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ConversationSubmitResponse"
  /models/listing:
    get:
      operationId: getModelListingAPI
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsListing"
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    ConversationSubmitRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
        prompt:
          type: string
    ConversationSubmitResponse:
      type: object
      required:
        - conversationId
        - type
      properties:
        type:
          type: string
        message:
          type: string
    ModelsListing:
      type: object
      required:
        - models
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelInfo"
    ModelInfo:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        name:
          type: string
  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: For internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
