# oapi-codegen config — generates Go types from services/api.yaml
# Run from repo root: go tool oapi-codegen -config services/leptos-agent/oapi-codegen.yaml services/api.yaml
package: main
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: true
output: services/leptos-agent/gen.go
